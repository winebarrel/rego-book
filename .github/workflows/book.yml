name: book

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OPA and Conftest
        run: |
          scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting of examples
        run: scripts/check-examples.sh

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      # Cache TinyTeX together with the LaTeX packages the PDF build needs (.github/tex-packages.txt).
      # If the build starts needing a package that is not listed, Quarto installs it on the fly,
      # so add it to .github/tex-packages.txt to keep it in the cache.
      - name: Cache TinyTeX
        id: cache-tinytex
        uses: actions/cache@v6
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-quarto-1.11.9-${{ hashFiles('.github/tex-packages.txt') }}

      - name: Install TinyTeX and LaTeX packages
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          quarto install tool tinytex --no-prompt --log-level warning
          ~/.TinyTeX/bin/x86_64-linux/tlmgr update --self
          ~/.TinyTeX/bin/x86_64-linux/tlmgr install $(cat .github/tex-packages.txt)

      - name: Add TinyTeX to PATH
        run: echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      # scripts/gen-outputs.sh runs as a pre-render step and generates the outputs of the examples.
      - name: Build book
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

      - uses: actions/upload-artifact@v7
        with:
          name: book
          path: |
            _book/rego-book.pdf
            _book/rego-book.epub

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: book
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            rego-book.pdf
            rego-book.epub
