name: book

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install OPA and Conftest
        run: |
          scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check formatting of examples
        run: scripts/check-examples.sh

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: true

      # scripts/gen-outputs.sh runs as a pre-render step and generates the outputs of the examples.
      - name: Build book
        run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _book

      - uses: actions/upload-artifact@v7
        with:
          name: book
          path: |
            _book/rego-book.pdf
            _book/rego-book.epub

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: book
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            rego-book.pdf
            rego-book.epub
